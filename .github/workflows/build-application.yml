name: Build Application

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'staging'
        type: choice
        options:
          - simulator
          - development
          - staging
          - production
      baseUrl:
        description: 'Backend base URL'
        required: true
        default: 'https://stage.little-world.com'
      buildAndroid:
        description: 'Build Android'
        required: true
        default: true
        type: boolean
      buildIos:
        description: 'Build iOS'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: write

jobs:
  build-android:
    name: Build Android (${{ github.event.inputs.profile || 'staging' }})
    if: >
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'build-android') ||
      (github.event_name == 'pull_request' && github.event.action == 'synchronize' &&
        contains(github.event.pull_request.labels.*.name, 'build-android')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.buildAndroid == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: staging-build-android-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    env:
      GRADLE_OPTS: -Xmx16g
      NODE_OPTIONS: --max_old_space_size=16384
      IS_CI_BUILD: 'true'
      PROFILE: ${{ github.event.inputs.profile || 'staging' }}
      BASE_URL: ${{ github.event.inputs.baseUrl || 'https://stage.little-world.com' }}
    steps:
      - name: Checkout little-world-native with submodule at pinned commit
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BOT_PAT }}

      - name: Resolve env-file from profile
        id: envfile
        shell: bash
        run: |
          case "$PROFILE" in
            production) echo "name=env.prod.ts" >> "$GITHUB_OUTPUT" ;;
            staging)    echo "name=env.staging.ts" >> "$GITHUB_OUTPUT" ;;
            *)          echo "name=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Setup build workspace
        id: setup
        uses: ./.github/actions/setup-build-workspace
        with:
          base-url: ${{ env.BASE_URL }}
          env-file: ${{ steps.envfile.outputs.name }}
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android (EAS)
        id: build
        shell: bash
        run: |
          set -euo pipefail
          eas build --platform android --profile "$PROFILE" --non-interactive --json > build_output.json
          URL=$(jq -r '.[0].artifacts.buildUrl // empty' build_output.json)
          if [ -z "$URL" ]; then
            echo "Could not find android artifact URL" >&2
            cat build_output.json >&2
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "ext=${URL##*.}" >> "$GITHUB_OUTPUT"

      - name: Download Android artifact from EAS
        shell: bash
        env:
          URL: ${{ steps.build.outputs.url }}
          EXT: ${{ steps.build.outputs.ext }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          curl -fL --retry 5 --retry-all-errors --retry-delay 15 --connect-timeout 30 --max-time 1800 -o "eas-build.${EXT}" "$URL"

      - name: Sign universal APK from AAB
        if: steps.build.outputs.ext == 'aab'
        uses: ./.github/actions/build-signed-apk
        with:
          aab-path: eas-build.aab
          apk-path: release-artifacts/little-world_${{ steps.setup.outputs.version }}-${{ env.PROFILE }}-android.apk
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Collect prebuilt APK
        if: steps.build.outputs.ext == 'apk'
        shell: bash
        run: mv eas-build.apk "release-artifacts/little-world_${{ steps.setup.outputs.version }}-${{ env.PROFILE }}-android.apk"

      - name: Upload android artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: little-world_${{ steps.setup.outputs.version }}-${{ env.PROFILE }}-android
          path: release-artifacts/*
          if-no-files-found: error

      - name: Update staging builds sticky comment (android)
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.upload.outputs.artifact-url }}
          EXT: apk
          PLATFORM: android
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export COMMIT_SHA="$HEAD_SHA"
          export COMMIT_MSG=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq '.commit.message')
          export TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M")
          MARKER="<!-- staging-builds:start -->"
          for attempt in 1 2 3; do
            COMMENT_JSON=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
              --jq "[.[] | select(.body | contains(\"$MARKER\"))] | .[0] // empty")
            if [ -n "$COMMENT_JSON" ]; then
              COMMENT_ID=$(echo "$COMMENT_JSON" | jq -r '.id')
              export CURRENT_BODY=$(echo "$COMMENT_JSON" | jq -r '.body')
            else
              COMMENT_ID=""
              export CURRENT_BODY=""
            fi
            python3 .github/scripts/update-pr-staging-table.py > new_comment.md
            if [ -n "$COMMENT_ID" ]; then
              if jq -Rs '{body: .}' new_comment.md | \
                  gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --input -; then
                echo "Comment updated on attempt $attempt"
                break
              fi
            else
              if gh pr comment "$PR_NUMBER" --body-file new_comment.md; then
                echo "Comment created on attempt $attempt"
                break
              fi
            fi
            echo "Attempt $attempt failed, retrying"
            sleep $((RANDOM % 11 + 5))
          done

  build-ios:
    name: Build iOS (${{ github.event.inputs.profile || 'staging' }})
    if: >
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'build-ios') ||
      (github.event_name == 'pull_request' && github.event.action == 'synchronize' &&
        contains(github.event.pull_request.labels.*.name, 'build-ios')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.buildIos == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: staging-build-ios-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    env:
      NODE_OPTIONS: --max_old_space_size=16384
      IS_CI_BUILD: 'true'
      PROFILE: ${{ github.event.inputs.profile || 'staging' }}
      BASE_URL: ${{ github.event.inputs.baseUrl || 'https://stage.little-world.com' }}
    steps:
      - name: Checkout little-world-native with submodule at pinned commit
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BOT_PAT }}

      - name: Resolve env-file from profile
        id: envfile
        shell: bash
        run: |
          case "$PROFILE" in
            production) echo "name=env.prod.ts" >> "$GITHUB_OUTPUT" ;;
            staging)    echo "name=env.staging.ts" >> "$GITHUB_OUTPUT" ;;
            *)          echo "name=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Setup build workspace
        id: setup
        uses: ./.github/actions/setup-build-workspace
        with:
          base-url: ${{ env.BASE_URL }}
          env-file: ${{ steps.envfile.outputs.name }}
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS (EAS)
        id: build
        shell: bash
        env:
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          eas build --platform ios --profile "$PROFILE" --non-interactive --json > build_output.json
          URL=$(jq -r '.[0].artifacts.buildUrl // empty' build_output.json)
          if [ -z "$URL" ]; then
            echo "Could not find iOS artifact URL" >&2
            cat build_output.json >&2
            exit 1
          fi
          OUT="$GITHUB_WORKSPACE/release-artifacts/little-world_${VERSION}-${PROFILE}-ios.ipa"
          curl -fL -o "$OUT" "$URL"
          ls -lh "$OUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-world_${{ steps.setup.outputs.version }}-${{ env.PROFILE }}-ios
          path: release-artifacts/*
          if-no-files-found: error

      - name: Update staging builds sticky comment (ios)
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.build.outputs.url }}
          EXT: ipa
          PLATFORM: ios
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export COMMIT_SHA="$HEAD_SHA"
          export COMMIT_MSG=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq '.commit.message')
          export TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M")
          MARKER="<!-- staging-builds:start -->"
          for attempt in 1 2 3; do
            COMMENT_JSON=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
              --jq "[.[] | select(.body | contains(\"$MARKER\"))] | .[0] // empty")
            if [ -n "$COMMENT_JSON" ]; then
              COMMENT_ID=$(echo "$COMMENT_JSON" | jq -r '.id')
              export CURRENT_BODY=$(echo "$COMMENT_JSON" | jq -r '.body')
            else
              COMMENT_ID=""
              export CURRENT_BODY=""
            fi
            python3 .github/scripts/update-pr-staging-table.py > new_comment.md
            if [ -n "$COMMENT_ID" ]; then
              if jq -Rs '{body: .}' new_comment.md | \
                  gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --input -; then
                echo "Comment updated on attempt $attempt"
                break
              fi
            else
              if gh pr comment "$PR_NUMBER" --body-file new_comment.md; then
                echo "Comment created on attempt $attempt"
                break
              fi
            fi
            echo "Attempt $attempt failed, retrying"
            sleep $((RANDOM % 11 + 20))
          done
