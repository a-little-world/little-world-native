name: Lockfile

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: Verify lockfile is up-to-date
    runs-on: ubuntu-latest
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: little-world-native,little-world-frontend,little-world-e2e-tests
          permission-contents: read

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: package.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check shared deps match frontend
        run: node .github/scripts/sync-shared-deps.mts --check

      - name: Check lockfile
        run: pnpm install --frozen-lockfile --lockfile-only

      - name: How to fix
        if: failure()
        run: |
          echo "::error::pnpm-lock.yaml is out of date. Run 'pnpm install --lockfile-only' and commit it"
