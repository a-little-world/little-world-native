name: Renovate

on:
  schedule:
    # daily for security PRs; regular updates gated by renovate.json schedule
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: Renovate dry-run mode (empty = real run)
        type: choice
        options: ['', 'full', 'lookup']
        default: ''
      logLevel:
        type: choice
        options: [info, debug]
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.7
        with:
          token: ${{ secrets.BOT_PAT }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'required'
          RENOVATE_PLATFORM_COMMIT: 'enabled'
          RENOVATE_DRY_RUN: ${{ inputs.dryRun || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
