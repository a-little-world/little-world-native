name: Renovate

on:
  # dashboard / PR checkboxes
  issues:
    types: [edited]
  pull_request:
    types: [edited]
  schedule:
    # daily for security PRs; regular updates gated by renovate.json schedule
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: Renovate dry-run mode (empty = real run)
        type: choice
        options: ['', 'full', 'lookup']
        default: ''
      logLevel:
        type: choice
        options: [info, debug]
        default: info
      repoCache:
        description: Reset or disable the cache?
        type: choice
        options: [enabled, disabled, reset]
        default: enabled

permissions:
  contents: read

env:
  cache_dir: /tmp/renovate/cache/renovate/repository
  cache_key: renovate-cache

jobs:
  renovate:
    name: Renovate
    # skip renovate's own edits, else every run triggers the next
    if: >
      github.actor != 'little-world-bot[bot]' && (
        github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issues' && github.event.issue.title == 'Dependency Dashboard') ||
        (github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/'))
      )
    # job-level so skipped runs can't displace a pending real one
    concurrency:
      group: renovate
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: little-world-native,little-world-frontend

      - name: Restore Renovate cache
        id: cache-restore
        if: inputs.repoCache != 'disabled' && inputs.repoCache != 'reset'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.cache_dir }}
          key: ${{ env.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.cache_key }}-

      # renovate runs in its container as uid 12021
      - name: Fix restored cache ownership
        if: steps.cache-restore.outputs.cache-matched-key != ''
        run: sudo chown -R 12021:0 /tmp/renovate/

      - name: Run Renovate
        uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'required'
          RENOVATE_PLATFORM_COMMIT: 'enabled'
          RENOVATE_REPOSITORY_CACHE: ${{ inputs.repoCache || 'enabled' }}
          RENOVATE_GIT_AUTHOR: 'little-world-bot[bot] <341493121+little-world-bot[bot]@users.noreply.github.com>'
          RENOVATE_DRY_RUN: ${{ inputs.dryRun || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}

      - name: Save Renovate cache
        if: inputs.repoCache != 'disabled' && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.cache_dir }}
          key: ${{ env.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
