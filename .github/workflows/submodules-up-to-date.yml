name: Submodules

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: submodules-up-to-date-${{ github.ref }}
  cancel-in-progress: true

jobs:
  up-to-date:
    name: Submodules are up-to-date
    runs-on: ubuntu-latest
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: little-world-native,little-world-frontend,little-world-e2e-tests
          permission-contents: read

      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Verify each submodule is at its main HEAD
        run: |
          set -uo pipefail
          failed=0
          for sm_path in $(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}'); do
            pinned=$(git rev-parse "HEAD:$sm_path")
            git -C "$sm_path" fetch -q origin main
            latest=$(git -C "$sm_path" rev-parse origin/main)
            if [ "$pinned" != "$latest" ]; then
              echo "::error::$sm_path is behind main (pinned $pinned, main $latest) - run 'git -C $sm_path fetch origin main && git -C $sm_path checkout --detach origin/main && git add $sm_path' and commit the reference"
              failed=1
            else
              echo "$sm_path is at main HEAD ($pinned)"
            fi
          done
          exit $failed
