name: Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: little-world-native,little-world-frontend,little-world-e2e-tests
          permission-contents: read

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Run eslint
        run: pnpm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: little-world-native,little-world-frontend,little-world-e2e-tests
          permission-contents: read

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Sync environment into frontend
        run: ./_scripts/setup_local_frontend.sh

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build frontend type declarations
        run: pnpm frontend:types

      - name: Run tsc
        run: pnpm run typecheck

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Run prettier --check
        run: pnpm run format:check
