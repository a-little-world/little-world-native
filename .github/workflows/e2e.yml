name: E2E

# Runs the e2e suite against a backend built + started INSIDE
# this pipeline, pinned to a single backend ref (`.backend-ref`, overridable via
# the workflow_dispatch input). The backend repo is checked out ephemerally
# (no working-tree clutter here) and built frontend-free, with Docker layer
# caching via the GitHub Actions cache.
#
# Optimisation: the backend's Dockerfile.full builds three webpack frontends and
# COPYs them into the final image. The e2e suite only needs the JSON API
# (the native app is served separately from dist/), so we mechanically strip the
# frontend stages from Dockerfile.full and build only the `backend` target. We
# then run it via the backend's own ci compose (`--no-build`) so the container
# env + redis wiring stay in lockstep with the backend (no drift).

on:
  workflow_dispatch:
    inputs:
      backendRef:
        description: 'Backend git ref to test against (overrides .backend-ref)'
        required: false
        default: ''
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'e2e') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_BACKEND_URL: http://127.0.0.1:8000
      PLAYWRIGHT_INSTALL_FLAGS: --with-deps
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BOT_PAT }}

      - name: Resolve backend ref
        id: ref
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.backendRef }}"
          if [ -z "$REF" ]; then
            REF="$(grep -vE '^\s*(#|$)' .backend-ref | head -n1 | tr -d '[:space:]')"
          fi
          [ -n "$REF" ] || { echo "No backend ref (input empty and .backend-ref blank)" >&2; exit 1; }
          echo "Backend ref: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout backend (ephemeral, no submodules)
        uses: actions/checkout@v4
        with:
          repository: a-little-world/little-world-backend
          ref: ${{ steps.ref.outputs.ref }}
          path: backend
          token: ${{ secrets.BOT_PAT }}
          # No submodules: frontends aren't built, and _cookie_consent_repo is
          # web-only (native has no consent banner) so the API path doesn't need it.
          submodules: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (frontend-free, cached)
        working-directory: backend
        run: |
          set -euo pipefail
          echo "${{ secrets.BOT_PAT }}" | docker login ghcr.io -u littleworld-bot --password-stdin
          # Strip the frontend stages: keep from the `backend` stage onward and
          # drop the `COPY --from=*_frontend_image` + matching mkdir lines.
          sed -n '/AS backend$/,$p' Dockerfile.full \
            | sed '/_frontend_image/d; /mkdir -p \.\/static\/dist\/.*_frontend/d' > Dockerfile.backend-slim
          grep -q 'AS backend' Dockerfile.backend-slim || { echo "strip failed: no backend stage found" >&2; exit 1; }
          docker buildx build \
            --target backend \
            --build-arg DEVELOPMENT=false \
            --build-arg TESTING=true \
            --build-arg ENTRYPOINT=./entry.sh \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            -t lw-backend:e2e \
            -f Dockerfile.backend-slim \
            .

      - name: Start backend + redis (ci compose, prebuilt image)
        working-directory: backend
        run: |
          set -euo pipefail
          cp dev/ci/docker-compose.ci.yaml docker-compose.yaml
          cat > .env <<'EOF'
          APP_IMAGE_URL=lw-backend:e2e
          BUILD_TYPE=pro
          ENTRYPOINT=./entry.sh
          DEVELOPMENT=false
          TESTING=true
          WEBPACK_PUBLIC_PATH=
          REDIS_URL=redis://redis:6379
          DJ_REDIS_HOST=redis
          DJ_REDIS_PORT=6379
          CI=true
          DJANGO_TESTING=true
          DJ_ENABLE_E2E_TEST_APIS=true
          DJ_AWS_STATIC_ACCESS_KEY_ID=
          DJ_AWS_STATIC_SECRET_KEY=
          DJ_AWS_STATIC_BUCKET_NAME=
          DJ_AWS_REGION_NAME=
          EOF
          # ci compose doesn't declare the native integrity-bypass token; inject it.
          cat > docker-compose.override.yaml <<'EOF'
          services:
            all:
              environment:
                DJ_NATIVE_APP_INTEGRITY_BYPASS_TOKEN: "bypassChangeMe!"
          EOF
          # --no-build: use the buildx image we just tagged as APP_IMAGE_URL.
          docker compose up -d --no-build redis all

      - name: Wait for backend readiness
        run: |
          set -euo pipefail
          echo "Waiting for backend API on $E2E_BACKEND_URL ..."
          for i in $(seq 1 90); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$E2E_BACKEND_URL/api/user/authenticated/" || true)"
            if [ "$code" != "000" ]; then
              echo "Backend responding (HTTP $code) after $((i*2))s"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready in time" >&2
          docker compose -f backend/docker-compose.yaml logs || true
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run e2e suite
        # --build exports dist/ with EXPO_PUBLIC_BACKEND_URL=$E2E_BACKEND_URL baked in;
        # the serve_native fixture serves it. run_native.sh bootstraps the venv + browser.
        run: bash e2e_simulations/run_native.sh --build

      - name: Backend logs
        if: always()
        working-directory: backend
        run: docker compose logs --no-color > ../backend.log 2>&1 || true

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend.log
          if-no-files-found: ignore
