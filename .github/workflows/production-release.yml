name: Production Release

on:
  release:
    types: [published]
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      baseUrl:
        description: "Base URL for backend"
        required: false
        default: "https://little-world.com"

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: true

env:
  BASE_URL: ${{ github.event.inputs.baseUrl || 'https://little-world.com' }}

jobs:
  build-android:
    name: Build Android (production)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setup.outputs.version }}
      build-id: ${{ steps.build.outputs.build_id }}
      build-url: ${{ steps.build.outputs.build_url }}
      build-ext: ${{ steps.build.outputs.build_ext }}
      app-version: ${{ steps.build.outputs.app_version }}
      app-build-version: ${{ steps.build.outputs.app_build_version }}
    env:
      GRADLE_OPTS: -Xmx16g
      NODE_OPTIONS: --max_old_space_size=16384
      IS_CI_BUILD: "true"
    steps:
      - name: Checkout little-world-native with submodule at pinned commit
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BOT_PAT }}

      - name: Setup build workspace
        id: setup
        uses: ./.github/actions/setup-build-workspace
        with:
          base-url: ${{ env.BASE_URL }}
          env-file: env.prod.ts
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android (EAS, production)
        id: build
        shell: bash
        run: |
          set -euo pipefail
          eas build --platform android --profile production --non-interactive --json > build_output.json
          BUILD_ID=$(jq -r '.[0].id // empty' build_output.json)
          URL=$(jq -r '.[0].artifacts.buildUrl // empty' build_output.json)
          APP_VERSION=$(jq -r '.[0].appVersion // empty' build_output.json)
          APP_BUILD_VERSION=$(jq -r '.[0].appBuildVersion // empty' build_output.json)
          if [ -z "$BUILD_ID" ] || [ -z "$URL" ] || [ -z "$APP_VERSION" ] || [ -z "$APP_BUILD_VERSION" ]; then
            echo "Could not find android build id/url/version" >&2
            cat build_output.json >&2
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "build_url=$URL" >> "$GITHUB_OUTPUT"
          echo "build_ext=${URL##*.}" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_build_version=$APP_BUILD_VERSION" >> "$GITHUB_OUTPUT"

  submit-android:
    name: Submit Android to Play Store
    needs: build-android
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=16384
    steps:
      - name: Checkout little-world-native
        uses: actions/checkout@v4

      - name: Setup workspace (submit-only)
        uses: ./.github/actions/setup-build-workspace
        with:
          base-url: ${{ env.BASE_URL }}
          env-file: env.prod.ts
          expo-token: ${{ secrets.EXPO_TOKEN }}
          sync-frontend: "false"

      - name: Submit to Play Store
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          BUILD_ID: ${{ needs.build-android.outputs.build-id }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY" > google-service-account-key.json
          eas submit --platform android --profile production --non-interactive --id "$BUILD_ID"

  build-ios:
    name: Build iOS (production)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setup.outputs.version }}
      build-id: ${{ steps.build.outputs.build_id }}
      build-url: ${{ steps.build.outputs.build_url }}
      app-version: ${{ steps.build.outputs.app_version }}
      app-build-version: ${{ steps.build.outputs.app_build_version }}
    env:
      NODE_OPTIONS: --max_old_space_size=16384
      IS_CI_BUILD: "true"
    steps:
      - name: Checkout little-world-native with submodule at pinned commit
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BOT_PAT }}

      - name: Setup build workspace
        id: setup
        uses: ./.github/actions/setup-build-workspace
        with:
          base-url: ${{ env.BASE_URL }}
          env-file: env.prod.ts
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS (EAS, production)
        id: build
        shell: bash
        run: |
          set -euo pipefail
          eas build --platform ios --profile production --non-interactive --json > build_output.json
          BUILD_ID=$(jq -r '.[0].id // empty' build_output.json)
          URL=$(jq -r '.[0].artifacts.buildUrl // empty' build_output.json)
          APP_VERSION=$(jq -r '.[0].appVersion // empty' build_output.json)
          APP_BUILD_VERSION=$(jq -r '.[0].appBuildVersion // empty' build_output.json)
          if [ -z "$BUILD_ID" ] || [ -z "$URL" ] || [ -z "$APP_VERSION" ] || [ -z "$APP_BUILD_VERSION" ]; then
            echo "Could not find iOS build id/url/version" >&2
            cat build_output.json >&2
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "build_url=$URL" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_build_version=$APP_BUILD_VERSION" >> "$GITHUB_OUTPUT"

  attach-release-assets:
    name: Attach build artifacts to GitHub release
    if: github.event_name == 'release'
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout little-world-native
        uses: actions/checkout@v4

      - name: Download artifacts from EAS
        shell: bash
        env:
          VERSION: ${{ needs.build-ios.outputs.version }}
          ANDROID_URL: ${{ needs.build-android.outputs.build-url }}
          ANDROID_EXT: ${{ needs.build-android.outputs.build-ext }}
          IOS_URL: ${{ needs.build-ios.outputs.build-url }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ANDROID_OUT="artifacts/little-world-app_${VERSION}-android.${ANDROID_EXT}"
          IOS_OUT="artifacts/little-world-app_${VERSION}-ios.ipa"
          curl -fL --retry 5 --retry-all-errors --retry-delay 15 --connect-timeout 30 --max-time 1800 -o "$ANDROID_OUT" "$ANDROID_URL"
          curl -fL --retry 5 --retry-all-errors --retry-delay 15 --connect-timeout 30 --max-time 1800 -o "$IOS_OUT" "$IOS_URL"
          ls -lh artifacts

      - name: Build signed universal APK from the AAB
        uses: ./.github/actions/build-signed-apk
        with:
          aab-path: artifacts/little-world-app_${{ needs.build-ios.outputs.version }}-android.aab
          apk-path: artifacts/little-world-app_${{ needs.build-ios.outputs.version }}-android.apk
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"

  submit-ios:
    name: Submit iOS to App Store
    needs: build-ios
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=16384
    steps:
      - name: Checkout little-world-native
        uses: actions/checkout@v4

      - name: Setup workspace (submit-only)
        uses: ./.github/actions/setup-build-workspace
        with:
          base-url: ${{ env.BASE_URL }}
          env-file: env.prod.ts
          expo-token: ${{ secrets.EXPO_TOKEN }}
          sync-frontend: "false"

      - name: Submit to App Store
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          BUILD_ID: ${{ needs.build-ios.outputs.build-id }}
        run: |
          set -euo pipefail
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > app-store-connect-api-key.p8
          eas submit --platform ios --profile production --non-interactive --id "$BUILD_ID"

  notify-sentry:
    name: Notify Sentry of production deploy
    needs: [build-android, build-ios, submit-android, submit-ios]
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: a-little-world-gug
      SENTRY_PROJECT: lw-prod-native
      BUNDLE_ID: com.littleworld.littleworldapp
      # Exact version/build numbers baked into each artifact, straight from `eas build --json`
      IOS_VERSION: ${{ needs.build-ios.outputs.app-version }}
      IOS_BUILD: ${{ needs.build-ios.outputs.app-build-version }}
      ANDROID_VERSION: ${{ needs.build-android.outputs.app-version }}
      ANDROID_BUILD: ${{ needs.build-android.outputs.app-build-version }}
    steps:
      - name: Checkout (full history for --auto commit detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install sentry-cli
        run: curl -sL https://sentry.io/get-cli/ | bash

      - name: Create + finalize + deploy Sentry releases
        shell: bash
        run: |
          set -euo pipefail
          IOS_RELEASE="${BUNDLE_ID}@${IOS_VERSION}+${IOS_BUILD}"
          ANDROID_RELEASE="${BUNDLE_ID}@${ANDROID_VERSION}+${ANDROID_BUILD}"

          for RELEASE in "$IOS_RELEASE" "$ANDROID_RELEASE"; do
            echo "::group::Sentry release $RELEASE"
            sentry-cli releases new "$RELEASE"
            sentry-cli releases set-commits "$RELEASE" --auto
            sentry-cli releases finalize "$RELEASE"
            sentry-cli releases deploys "$RELEASE" new -e production
            echo "::endgroup::"
          done
