name: Android Build (EAS local) Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.2.3)"
        required: true
      name:
        description: "Release name (optional)"
        required: false
      prerelease:
        description: "Mark as prerelease (true/false)"
        required: true
        default: "true"
      baseUrl:
        description: "Base URL for backend (e.g., https://api.example.com)"
        required: false
        default: ""
      easBuildTag:
        description: "EAS build type"
        required: false
        default: "preview"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Xmx16g
      NODE_OPTIONS: --max_old_space_size=16384
    steps:
      - name: Checkout little-world-native with submodule at pinned commit
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BOT_PAT }}

      - name: Determine build environment
        id: environment
        run: |
          echo "EAS_VERSION=$(jq -r '.cli.version' eas.json)" >> $GITHUB_ENV
          EAS_BUILD_TAG="${{ github.event.inputs.easBuildTag }}"
          if [[ "$EAS_BUILD_TAG" == "preview" ]]; then
            echo "STAGING=true" >> $GITHUB_OUTPUT
            echo "PRODUCTION=false" >> $GITHUB_OUTPUT
          elif [[ "$EAS_BUILD_TAG" == "production" ]]; then
            echo "PRODUCTION=true" >> $GITHUB_OUTPUT
            echo "STAGING=false" >> $GITHUB_OUTPUT
          else
            echo "PRODUCTION=false" >> $GITHUB_OUTPUT
            echo "STAGING=false" >> $GITHUB_OUTPUT
          fi

      - name: Install base packages (act only)
        if: ${{ env.ACT }}
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl unzip ca-certificates
          ls -la

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Install missing tools (act only)
        if: ${{ env.ACT }}
        run: pnpm install -g yarn
        # yarn is required for expo setup

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: ${{ env.EAS_VERSION }}
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Patch native environment.ts and sync to frontend
        run: |
          BASE_URL="${{ github.event.inputs.baseUrl }}"
          sed -i.bak "s|isNative: .*,|isNative: true,|" environment.ts
          if [[ -n "$BASE_URL" && "$BASE_URL" == *ngrok* ]]; then
            sed -i.bak "s|allowNgrokRequests: .*,|allowNgrokRequests: true,|" environment.ts
          else
            sed -i.bak "s|allowNgrokRequests: .*,|allowNgrokRequests: false,|" environment.ts
          fi
          if [ -n "$BASE_URL" ]; then
            sed -i.bak "s|backendUrl: '.*'|backendUrl: '$BASE_URL'|" environment.ts
          fi
          rm -f environment.ts.bak
          ./_scripts/setup_local_frontend.sh

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify toolchain
        run: |
          node -v
          pnpm -v
          eas whoami || true

      - name: Inject base URL into src/config/environment-native.ts
        shell: bash
        run: |
          set -euo pipefail
          FILE="src/config/environment-native.ts"
          cp "$FILE" "$FILE.bak"

          # Inputs from workflow_dispatch
          BASE_URL='${{ github.event.inputs.baseUrl }}'

          # Only replace when inputs are provided (non-empty)
          if [ -n "${BASE_URL}" ]; then
            # Update backendUrl if present in this config file layout
            sed -i.bak "s|backendUrl: \".*\"|backendUrl: \"${BASE_URL}\"|" "$FILE" || true
          fi
          echo "Injected base URL value into $FILE"

      - name: Build Android APK (EAS Cloud)
        env:
          IS_CI_BUILD: true
        run: |
          mv eas.ci.json eas.json

          if [[ "${{ steps.environment.outputs.PRODUCTION }}" == "true" ]]; then
            mv ./environments/env.prod.ts ./environments/env.ts
          elif [[ "${{ steps.environment.outputs.STAGING }}" == "true" ]]; then
            mv ./environments/env.staging.ts ./environments/env.ts
          fi

          # Run build and capture output
          set -o pipefail
          eas build --platform android --profile "${{ github.event.inputs.easBuildTag }}" --non-interactive | tee build_output.txt

          # Extract URL
          URL=$(grep -oE 'https://expo\.dev/artifacts/eas/[a-zA-Z0-9._-]+\.(apk|aab)' build_output.txt | tail -n1)

          if [ -z "$URL" ]; then
            echo "Error: Could not find artifact URL in build output."
            exit 1
          fi

          echo "Found artifact URL: $URL"

          # Determine extension and download
          EXT="${URL##*.}"
          FILENAME="build-artifact.$EXT"

          echo "Downloading to $FILENAME..."
          curl -L -o "$FILENAME" "$URL"

          echo "Download complete."
          ls -lh "$FILENAME"

      - name: Locate Android Build File
        id: locate_build_file
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE_PATH=""
          EAS_BUILD_TAG="${{ github.event.inputs.easBuildTag }}"

          # Check for AAB files first (production builds)
          if [ "$EAS_BUILD_TAG" = "production" ]; then
            if ls build-*.aab >/dev/null 2>&1; then
              BUILD_FILE_PATH=$(ls -t build-*.aab | head -n1)
            elif ls *.aab >/dev/null 2>&1; then
              BUILD_FILE_PATH=$(ls -t *.aab | head -n1)
            else
              BUILD_FILE_PATH=$(ls -t android/app/build/outputs/bundle/**/*.aab 2>/dev/null | head -n1 || true)
            fi
          else
            # Check for APK files (preview/development builds)
            if ls build-*.apk >/dev/null 2>&1; then
              BUILD_FILE_PATH=$(ls -t build-*.apk | head -n1)
            elif ls *.apk >/dev/null 2>&1; then
              BUILD_FILE_PATH=$(ls -t *.apk | head -n1)
            else
              BUILD_FILE_PATH=$(ls -t android/app/build/outputs/apk/**/*.apk 2>/dev/null | head -n1 || true)
            fi
          fi

          # Extract the actual file extension from the found file
          if [ -n "$BUILD_FILE_PATH" ]; then
            FILE_EXTENSION="${BUILD_FILE_PATH##*.}"
          else
            # Fallback based on build profile if no file found
            if [ "$EAS_BUILD_TAG" = "production" ]; then
              FILE_EXTENSION="aab"
            else
              FILE_EXTENSION="apk"
            fi
          fi

          if [ -z "$BUILD_FILE_PATH" ]; then
            echo "No $FILE_EXTENSION file found for $EAS_BUILD_TAG build" >&2
            exit 1
          fi
          echo "build_file_path=./$BUILD_FILE_PATH" >> $GITHUB_OUTPUT
          echo "file_extension=$FILE_EXTENSION" >> $GITHUB_OUTPUT
          echo "Found $FILE_EXTENSION at $BUILD_FILE_PATH"

      - name: Rename Android Build File with unique name
        id: rename_build_file
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          RUN_NO="${{ github.run_number }}"
          ORIG_PATH="${{ steps.locate_build_file.outputs.build_file_path }}"
          FILE_EXT="${{ steps.locate_build_file.outputs.file_extension }}"
          # Ensure directory exists and compute new path
          BASENAME="app-${TAG}-${RUN_NO}.${FILE_EXT}"
          NEW_PATH="${BASENAME}"
          mv "$ORIG_PATH" "$NEW_PATH"
          echo "build_file_path=./$NEW_PATH" >> $GITHUB_OUTPUT
          echo "build_file_name=$BASENAME" >> $GITHUB_OUTPUT

      - name: Upload Android Build File artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.locate_build_file.outputs.file_extension }}-${{ github.event.inputs.tag }}-${{ github.run_number }}
          path: ${{ steps.rename_build_file.outputs.build_file_path }}
