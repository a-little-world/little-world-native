name: IOS EAS Build
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        required: true
        default: "production"
        type: choice
        options:
          - development
          - development-device
          - preview
          - production
      baseUrl:
        description: "Base URL for backend (e.g., https://little-world.com)"
        required: true
        default: "https://little-world.com"

jobs:
  build-ios:
    name: Install and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout little-world-native with submodule at pinned commit
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BOT_PAT }}

      - name: environment
        run: |
          echo "EAS_VERSION=$(jq -r '.cli.version' eas.json)" >> $GITHUB_ENV
          if [[ "${{ inputs.profile }}" == "preview" ]]; then
            echo "STAGING=true" >> $GITHUB_ENV
            echo "PRODUCTION=false" >> $GITHUB_ENV
          elif [[ "${{ inputs.profile }}" == "production" ]]; then
            echo "PRODUCTION=true" >> $GITHUB_ENV
            echo "STAGING=false" >> $GITHUB_ENV
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
          # omit version, uses version of packageManager in package.json

      - name: Install missing tools (act only)
        if: ${{ env.ACT }}
        run: pnpm install -g yarn
        # yarn is required for expo setup

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: ${{ env.EAS_VERSION }}
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Patch native environment.ts and sync to frontend
        run: |
          BASE_URL="${{ inputs.baseUrl }}"
          sed -i.bak "s|isNative: .*,|isNative: true,|" environment.ts
          if [[ "$BASE_URL" == *ngrok* ]]; then
            sed -i.bak "s|allowNgrokRequests: .*,|allowNgrokRequests: true,|" environment.ts
          else
            sed -i.bak "s|allowNgrokRequests: .*,|allowNgrokRequests: false,|" environment.ts
          fi
          sed -i.bak "s|backendUrl: '.*'|backendUrl: '$BASE_URL'|" environment.ts
          rm -f environment.ts.bak
          ./_scripts/setup_local_frontend.sh

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build on EAS
        env:
          IS_CI_BUILD: true
        run: |
          mv eas.ci.json eas.json
          if [[ "$PRODUCTION" == "true" ]]; then
            mv ./environments/env.prod.ts ./environments/env.ts
          elif [[ "$STAGING" == "true" ]]; then
            mv ./environments/env.staging.ts ./environments/env.ts
          fi
          pnpm exec eas build --platform ios --profile ${{ inputs.profile }} --non-interactive --no-wait
