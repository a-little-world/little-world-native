name: IOS EAS Build
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        required: true
        default: "production"
        type: choice
        options:
          - development
          - development-device
          - preview
          - production
      baseUrl:
        description: "Base URL for backend (e.g., https://little-world.com)"
        required: true
        default: "https://little-world.com"
      frontendCommitRef:
        description: "Frontend commit ref"
        required: true
        default: "main"

jobs:
  build-ios:
    name: Install and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout little-world-native
        uses: actions/checkout@v4
        with:
          path: little-world-native

      - name: Checkout little-world-frontend submodule at requested ref
        uses: actions/checkout@v4
        with:
          repository: a-little-world/little-world-frontend
          ref: ${{ inputs.frontendCommitRef }}
          path: little-world-native/frontend
          token: ${{ secrets.BOT_PAT }}

      - name: environment
        run: |
          echo "EAS_VERSION=$(jq -r '.cli.version' little-world-native/eas.json)" >> $GITHUB_ENV
          if [[ "${{ inputs.profile }}" == "preview" ]]; then
            echo "STAGING=true" >> $GITHUB_ENV
            echo "PRODUCTION=false" >> $GITHUB_ENV
          elif [[ "${{ inputs.profile }}" == "production" ]]; then
            echo "PRODUCTION=true" >> $GITHUB_ENV
            echo "STAGING=false" >> $GITHUB_ENV
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: little-world-native/package.json
          # omit version, uses version of packageManager in package.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: ${{ env.EAS_VERSION }}
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Patch frontend environment for build
        working-directory: little-world-native/frontend
        run: |
          HOST_DOMAIN=$(echo "${{ inputs.baseUrl }}" | sed 's|^https\?://||')
          HTTP_SCHEME="https"
          FULL_HOST_DOMAIN="$HTTP_SCHEME://$HOST_DOMAIN"
          sed -i.bak "s|isNative: .*,|isNative: true,|" src/environment.ts
          if [[ "$HOST_DOMAIN" == *ngrok* ]]; then
            sed -i.bak "s|allowNgrokRequests: .*,|allowNgrokRequests: true,|" src/environment.ts
          else
            sed -i.bak "s|allowNgrokRequests: .*,|allowNgrokRequests: false,|" src/environment.ts
          fi
          sed -i.bak "s|backendUrl: '.*'|backendUrl: '$FULL_HOST_DOMAIN'|" src/environment.ts
          rm -f src/environment.ts.bak

      - name: Install workspace dependencies
        working-directory: little-world-native
        run: pnpm install --no-frozen-lockfile

      - name: Build on EAS
        env:
          IS_CI_BUILD: true
        run: |
          cd little-world-native
          mv eas.ci.json eas.json
          if [[ "$PRODUCTION" == "true" ]]; then
            mv ./environments/env.prod.ts ./environments/env.ts
          elif [[ "$STAGING" == "true" ]]; then
            mv ./environments/env.staging.ts ./environments/env.ts
          fi
          pnpm exec eas build --platform ios --profile ${{ inputs.profile }} --non-interactive --no-wait
