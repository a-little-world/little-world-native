name: Preview Build (PR)

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: write

env:
  BASE_URL: https://stage.little-world.com

jobs:
  setup:
    name: Prepare workspace
    if: >
      (github.event.action == 'labeled' &&
        (github.event.label.name == 'build-android' || github.event.label.name == 'build-ios')) ||
      (github.event.action == 'synchronize' &&
        (contains(github.event.pull_request.labels.*.name, 'build-android') ||
         contains(github.event.pull_request.labels.*.name, 'build-ios')))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      eas_version: ${{ steps.version.outputs.eas_version }}
      build_android: ${{ steps.platforms.outputs.build_android }}
      build_ios: ${{ steps.platforms.outputs.build_ios }}
    steps:
      - name: Determine platforms to build
        id: platforms
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          BUILD_ANDROID=false
          BUILD_IOS=false
          if [[ "$EVENT_ACTION" == "labeled" ]]; then
            case "$LABEL_NAME" in
              build-android) BUILD_ANDROID=true ;;
              build-ios) BUILD_IOS=true ;;
            esac
          else
            if echo "$PR_LABELS" | grep -q '"build-android"'; then BUILD_ANDROID=true; fi
            if echo "$PR_LABELS" | grep -q '"build-ios"'; then BUILD_IOS=true; fi
          fi
          echo "build_android=$BUILD_ANDROID" >> "$GITHUB_OUTPUT"
          echo "build_ios=$BUILD_IOS" >> "$GITHUB_OUTPUT"
          echo "android=$BUILD_ANDROID ios=$BUILD_IOS"

      - name: Checkout little-world-native with submodule at pinned commit
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BOT_PAT }}

      - name: Read app semver and EAS version
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Could not read version from package.json" >&2
            exit 1
          fi
          EAS_VERSION=$(jq -r '.cli.version' eas.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "eas_version=$EAS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Patch native environment.ts and sync to frontend
        run: |
          sed -i.bak "s|isNative: .*,|isNative: true,|" environment.ts
          sed -i.bak "s|allowNgrokRequests: .*,|allowNgrokRequests: false,|" environment.ts
          sed -i.bak "s|backendUrl: '.*'|backendUrl: '$BASE_URL'|" environment.ts
          rm -f environment.ts.bak
          ./_scripts/setup_local_frontend.sh

      - name: Switch to CI EAS config and staging env
        run: |
          mv eas.ci.json eas.json
          mv ./environments/env.staging.ts ./environments/env.ts

      - name: Package prepared workspace
        run: |
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./**/node_modules' \
              -czf /tmp/workspace.tar.gz .

      - name: Upload prepared workspace
        uses: actions/upload-artifact@v4
        with:
          name: prepared-workspace
          path: /tmp/workspace.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-android:
    name: Build Android (preview)
    needs: setup
    if: needs.setup.outputs.build_android == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-build-android-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GRADLE_OPTS: -Xmx16g
      NODE_OPTIONS: --max_old_space_size=16384
      IS_CI_BUILD: "true"
    steps:
      - name: Download prepared workspace
        uses: actions/download-artifact@v4
        with:
          name: prepared-workspace
          path: /tmp/workspace

      - name: Extract prepared workspace
        run: tar -xzf /tmp/workspace/workspace.tar.gz -C .

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: ${{ needs.setup.outputs.eas_version }}
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Android (EAS, preview)
        id: build
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          eas build --platform android --profile preview --non-interactive | tee build_output.txt
          URL=$(grep -oE 'https://expo\.dev/artifacts/eas/[a-zA-Z0-9._-]+\.(aab|apk)' build_output.txt | tail -n1)
          if [ -z "$URL" ]; then
            echo "Could not find android artifact URL" >&2
            exit 1
          fi
          EXT="${URL##*.}"
          OUT="$GITHUB_WORKSPACE/release-artifacts/little-world-app_${VERSION}-preview-android.${EXT}"
          curl -fL -o "$OUT" "$URL"
          ls -lh "$OUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "ext=$EXT" >> "$GITHUB_OUTPUT"

      - name: Upload android preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-world-app_${{ needs.setup.outputs.version }}-preview-android
          path: release-artifacts/*
          if-no-files-found: error

      - name: Comment Android download link on PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.build.outputs.url }}
          EXT: ${{ steps.build.outputs.ext }}
          VERSION: ${{ needs.setup.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --body "**Android preview build ready**

          [Download .$EXT]($URL) — \`little-world-app_${VERSION}-preview-android.$EXT\`

          Base URL: \`$BASE_URL\` · [Run]($RUN_URL)"

  build-ios:
    name: Build iOS (preview)
    needs: setup
    if: needs.setup.outputs.build_ios == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-build-ios-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      NODE_OPTIONS: --max_old_space_size=16384
      IS_CI_BUILD: "true"
    steps:
      - name: Download prepared workspace
        uses: actions/download-artifact@v4
        with:
          name: prepared-workspace
          path: /tmp/workspace

      - name: Extract prepared workspace
        run: tar -xzf /tmp/workspace/workspace.tar.gz -C .

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: ${{ needs.setup.outputs.eas_version }}
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build iOS (EAS, preview)
        id: build
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          eas build --platform ios --profile preview --non-interactive | tee build_output.txt
          URL=$(grep -oE 'https://expo\.dev/artifacts/eas/[a-zA-Z0-9._-]+\.ipa' build_output.txt | tail -n1)
          if [ -z "$URL" ]; then
            echo "Could not find iOS artifact URL" >&2
            exit 1
          fi
          OUT="$GITHUB_WORKSPACE/release-artifacts/little-world-app_${VERSION}-preview-ios.ipa"
          curl -fL -o "$OUT" "$URL"
          ls -lh "$OUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Upload iOS preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-world-app_${{ needs.setup.outputs.version }}-preview-ios
          path: release-artifacts/*
          if-no-files-found: error

      - name: Comment iOS download link on PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.build.outputs.url }}
          VERSION: ${{ needs.setup.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --body "**iOS preview build ready**

          [Download .ipa]($URL) — \`little-world-app_${VERSION}-preview-ios.ipa\`

          Base URL: \`$BASE_URL\` · [Run]($RUN_URL)"
