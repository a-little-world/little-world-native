name: Preview Build (PR)

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: write

env:
  BASE_URL: https://stage.little-world.com

jobs:
  build-android:
    name: Build Android (preview)
    if: >
      (github.event.action == 'labeled' && github.event.label.name == 'build-android') ||
      (github.event.action == 'synchronize' &&
        contains(github.event.pull_request.labels.*.name, 'build-android'))
    runs-on: ubuntu-latest
    concurrency:
      group: preview-build-android-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GRADLE_OPTS: -Xmx16g
      NODE_OPTIONS: --max_old_space_size=16384
      IS_CI_BUILD: "true"
    steps:
      - name: Checkout little-world-native with submodule at pinned commit
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BOT_PAT }}

      - name: Setup build workspace
        id: setup
        uses: ./.github/actions/setup-build-workspace
        with:
          base-url: ${{ env.BASE_URL }}
          env-file: env.staging.ts
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android (EAS, preview)
        id: build
        shell: bash
        env:
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          eas build --platform android --profile preview --non-interactive | tee build_output.txt
          URL=$(grep -oE 'https://expo\.dev/artifacts/eas/[a-zA-Z0-9._-]+\.(aab|apk)' build_output.txt | tail -n1)
          if [ -z "$URL" ]; then
            echo "Could not find android artifact URL" >&2
            exit 1
          fi
          EXT="${URL##*.}"
          OUT="$GITHUB_WORKSPACE/release-artifacts/little-world-app_${VERSION}-preview-android.${EXT}"
          curl -fL -o "$OUT" "$URL"
          ls -lh "$OUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "ext=$EXT" >> "$GITHUB_OUTPUT"

      - name: Upload android preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-world-app_${{ steps.setup.outputs.version }}-preview-android
          path: release-artifacts/*
          if-no-files-found: error

      - name: Update preview builds table in PR description (android)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.build.outputs.url }}
          EXT: ${{ steps.build.outputs.ext }}
          PLATFORM: android
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export COMMIT_SHA="$HEAD_SHA"
          export COMMIT_MSG=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq '.commit.message')
          export TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M")
          for attempt in 1 2 3; do
            export CURRENT_BODY=$(gh pr view "$PR_NUMBER" --json body -q .body)
            python3 .github/scripts/update-pr-preview-table.py > new_body.txt
            if gh pr edit "$PR_NUMBER" --body-file new_body.txt; then
              echo "PR body updated on attempt $attempt"
              break
            fi
            echo "Attempt $attempt failed, retrying"
            sleep $((RANDOM % 11 + 5))
          done

  build-ios:
    name: Build iOS (preview)
    if: >
      (github.event.action == 'labeled' && github.event.label.name == 'build-ios') ||
      (github.event.action == 'synchronize' &&
        contains(github.event.pull_request.labels.*.name, 'build-ios'))
    runs-on: ubuntu-latest
    concurrency:
      group: preview-build-ios-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      NODE_OPTIONS: --max_old_space_size=16384
      IS_CI_BUILD: "true"
    steps:
      - name: Checkout little-world-native with submodule at pinned commit
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BOT_PAT }}

      - name: Setup build workspace
        id: setup
        uses: ./.github/actions/setup-build-workspace
        with:
          base-url: ${{ env.BASE_URL }}
          env-file: env.staging.ts
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS (EAS, preview)
        id: build
        shell: bash
        env:
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          eas build --platform ios --profile preview --non-interactive | tee build_output.txt
          URL=$(grep -oE 'https://expo\.dev/artifacts/eas/[a-zA-Z0-9._-]+\.ipa' build_output.txt | tail -n1)
          if [ -z "$URL" ]; then
            echo "Could not find iOS artifact URL" >&2
            exit 1
          fi
          OUT="$GITHUB_WORKSPACE/release-artifacts/little-world-app_${VERSION}-preview-ios.ipa"
          curl -fL -o "$OUT" "$URL"
          ls -lh "$OUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Upload iOS preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-world-app_${{ steps.setup.outputs.version }}-preview-ios
          path: release-artifacts/*
          if-no-files-found: error

      - name: Update preview builds table in PR description (ios)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.build.outputs.url }}
          EXT: ipa
          PLATFORM: ios
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export COMMIT_SHA="$HEAD_SHA"
          export COMMIT_MSG=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq '.commit.message')
          export TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M")
          for attempt in 1 2 3; do
            export CURRENT_BODY=$(gh pr view "$PR_NUMBER" --json body -q .body)
            python3 .github/scripts/update-pr-preview-table.py > new_body.txt
            if gh pr edit "$PR_NUMBER" --body-file new_body.txt; then
              echo "PR body updated on attempt $attempt"
              break
            fi
            echo "Attempt $attempt failed, retrying"
            sleep $((RANDOM % 11 + 20))
          done
