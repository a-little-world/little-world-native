name: Build signed APKs
description: Generate a signed universal APK plus one per CPU architecture from an AAB with bundletool.

inputs:
  aab-path:
    required: true
    description: Path to the input .aab
  apk-path:
    required: true
    description: Path of the signed universal .apk; per-ABI ones are written next to it as <name>-<abi>.apk
  keystore-base64:
    required: true
    description: Base64-encoded signing keystore
  keystore-password:
    required: true
    description: Keystore password (PKCS12 keystore => also the key password)
  key-alias:
    required: true
    description: Key alias inside the keystore
  bundletool-version:
    required: false
    default: '1.17.2'
    description: bundletool release to use

runs:
  using: composite
  steps:
    - name: Set up JDK (for bundletool)
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
      with:
        distribution: temurin
        java-version: '25'

    - name: Build signed APKs
      shell: bash
      env:
        AAB_PATH: ${{ inputs.aab-path }}
        APK_PATH: ${{ inputs.apk-path }}
        BUNDLETOOL_VERSION: ${{ inputs.bundletool-version }}
        KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
        KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        KEY_ALIAS: ${{ inputs.key-alias }}
      run: |
        set -euo pipefail
        if [ ! -f "$AAB_PATH" ]; then
          echo "Expected AAB not found: $AAB_PATH" >&2
          ls -lh "$(dirname "$AAB_PATH")" >&2 || true
          exit 1
        fi
        curl -fL --retry 5 --retry-all-errors -o bundletool.jar \
          "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
        # Strip whitespace/CR before decoding — pasted secrets often carry newlines
        # or a stray \r that base64 -d rejects as "invalid input".
        printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > release.keystore
        [ -s release.keystore ] || { echo "Decoded keystore is empty — check ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
        # PKCS12 keystore: key password == store password
        java -jar bundletool.jar build-apks \
          --bundle="$AAB_PATH" \
          --output=app.apks \
          --mode=universal \
          --ks=release.keystore \
          --ks-key-alias="$KEY_ALIAS" \
          --ks-pass="pass:${KEYSTORE_PASSWORD}" \
          --key-pass="pass:${KEYSTORE_PASSWORD}"
        unzip -p app.apks universal.apk > universal.apk
        BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
        ABIS=$(unzip -Z1 universal.apk 'lib/*' | cut -d/ -f2 | sort -u)
        for abi in $ABIS; do
          OUT="${APK_PATH%.apk}-${abi}.apk"
          cp universal.apk stripped.apk
          for other in $ABIS; do
            [ "$other" = "$abi" ] || zip -qd stripped.apk "lib/$other/*"
          done
          "$BUILD_TOOLS/zipalign" -f -P 16 4 stripped.apk "$OUT"
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --key-pass "pass:${KEYSTORE_PASSWORD}" \
            "$OUT"
        done
        mv universal.apk "$APK_PATH"
        rm -f release.keystore app.apks bundletool.jar stripped.apk
        ls -lh "$(dirname "$APK_PATH")"
        "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT" | grep -i "SHA-256" || true
