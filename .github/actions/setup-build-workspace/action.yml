name: Setup build workspace
description: Patch environment, swap CI EAS config, install workspace deps. Assumes the repo (with submodules) is already checked out.

inputs:
  base-url:
    required: true
    description: "Backend base URL, written into environment.ts"
  env-file:
    required: false
    default: ""
    description: "Environment file in ./environments to promote to env.ts (e.g. env.prod.ts or env.staging.ts)"
  expo-token:
    required: true
    description: "Expo access token for EAS auth"
  sync-frontend:
    required: false
    default: "true"
    description: "Patch environment.ts and copy it into the frontend submodule. Set to 'false' for submit-only jobs that don't need the JS bundle."

outputs:
  version:
    description: "App semver from package.json"
    value: ${{ steps.version.outputs.version }}
  eas-version:
    description: "EAS CLI version from eas.json"
    value: ${{ steps.version.outputs.eas_version }}

runs:
  using: composite
  steps:
    - name: Read app semver and EAS version
      id: version
      shell: bash
      run: |
        set -euo pipefail
        VERSION=$(jq -r '.version' package.json)
        if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
          echo "Could not read version from package.json" >&2
          exit 1
        fi
        EAS_VERSION=$(jq -r '.cli.version' eas.json)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "eas_version=$EAS_VERSION" >> "$GITHUB_OUTPUT"

    - name: Patch native environment.ts and sync to frontend
      if: inputs.sync-frontend == 'true'
      shell: bash
      env:
        BASE_URL: ${{ inputs.base-url }}
      run: |
        set -euo pipefail
        # Patch environment variables up to comma (to avoid overwriting interface).
        # Abort if variable is not found.
        patch_env() {
          local key="$1" value="$2"
          if ! grep -qE "${key}: .*,$" environment.ts; then
            echo "Expected '${key}: ...,' in environment.ts, not found — patch aborted" >&2
            exit 1
          fi
          sed -i.bak -E "s|${key}: .*,$|${key}: ${value},|" environment.ts
        }
        patch_env isNative true
        patch_env allowNgrokRequests false
        patch_env backendUrl "'$BASE_URL'"
        rm -f environment.ts.bak
        ./_scripts/setup_local_frontend.sh

    - name: Switch to CI EAS config and selected env
      shell: bash
      env:
        ENV_FILE: ${{ inputs.env-file }}
      run: |
        set -euo pipefail
        if [ -n "$ENV_FILE" ]; then
          mv "./environments/$ENV_FILE" ./environments/env.ts
        fi

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        package_json_file: package.json

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install missing tools (act only)
      if: ${{ env.ACT }}
      shell: bash
      run: pnpm install -g yarn
      # yarn is required for expo setup

    - name: Setup Expo and EAS
      uses: expo/expo-github-action@v8
      with:
        eas-version: ${{ steps.version.outputs.eas_version }}
        token: ${{ inputs.expo-token }}

    - name: Install workspace dependencies
      shell: bash
      run: pnpm install --no-frozen-lockfile
